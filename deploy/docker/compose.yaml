# BangMusic 서버 — Docker Compose (docs/install/docker.md)
# 1) MUSIC_DIR를 내 음악 폴더로 바꾼다  2) docker compose up -d  3) 관리자·라이브러리 만들기(문서 4단계)
services:
  bangmusic:
    image: ${BANGMUSIC_IMAGE:-bangmusic-server:latest}
    container_name: bangmusic
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      BANGMUSIC_SERVER_NAME: "우리집 음악"
      BANGMUSIC_LOG_LEVEL: info
      # 리버스 프록시(NPM·Caddy 등) 뒤에 두면 그 주소. 여러 개면 쉼표로
      # BANGMUSIC_TRUST_PROXY: 192.168.0.5
      # 매일 백업 시각(UTC, 0~23). -1이면 끔
      # BANGMUSIC_BACKUP_HOUR_UTC: 18
    volumes:
      - bangmusic-data:/data      # DB·서명 키·백업 (지우면 계정과 플레이리스트가 사라진다)
      - bangmusic-cache:/cache    # 변환본·표지 캐시 (지워도 다시 만든다)
      - ${MUSIC_DIR:-/srv/music}:/music:ro   # 음악 원본 — 읽기 전용(:ro)으로만 붙인다
    # 음악 파일이 모두에게 읽기 권한이 없으면, 그 파일의 그룹 번호를 넣는다 (예: ls -n 으로 확인)
    # group_add:
    #   - "1100"

volumes:
  bangmusic-data:
  bangmusic-cache:
